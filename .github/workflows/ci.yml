# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  schedule:
    # Weekly: catches drift in what the pinned builds fetch.
    - cron: "23 4 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The unit tests check documents against the schemas in schemas/.
      - run: pip install jsonschema==4.26.0
      - name: versions.yaml matches the Dockerfiles
        run: scripts/check-versions.sh
      - name: RELEASE.md has the notes of the version versions.yaml names
        run: scripts/release-notes.sh > /dev/null
      - name: Shellcheck and Python
        run: make lint
      - name: Result scripts
        run: make unittests
      - name: No reference to a library under test
        # REQUIREMENTS.md R1: the adapters and the self-test must not know any
        # consumer (own/ is the one exception). The matrix scripts turn
        # go-profinet's results into the matrix and are not checked.
        run: |
          if grep -rInE 'otfabric/go-|go-profinet|profinetctl|otfnode' adapters tests/cases.tsv \
              scripts/lib.sh scripts/smoke.sh scripts/interop.sh scripts/interop.py scripts/test_interop.py scripts/check-contract.sh \
              scripts/check-capabilities.py; then
            echo "::error::consumer-specific reference found"; exit 1
          fi
      - name: No image is published
        # p-net, profinet-py, umrp and mrp are GPL: their images are built by each
        # user from upstream, never pushed by this repository.
        run: |
          if grep -rnE 'docker (push|buildx .*--push)' Makefile scripts; then
            echo "::error::a target pushes an image"; exit 1
          fi

  corpus:
    name: Corpus fetch tool
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: corpus/go.mod
      # Offline: the tests serve made-up files; nothing is downloaded.
      - name: Vet and test
        run: make corpus-test
      - name: No vendor file is committed
        run: |
          if git ls-files | grep -iE '(^|/)gsdml-.*\.(xml|zip)$' | grep -v '^adapters/'; then
            echo "::error::a GSDML file is committed (docs/CORPUS.md)"; exit 1
          fi

  images:
    name: Build and contract (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The contract checks every capability document against its schema.
      - run: pip install jsonschema==4.26.0
      - name: Build every adapter image
        run: make -j3 --output-sync=target images
      - name: Contract
        run: make contract | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Capabilities
        run: make capabilities | tee -a "$GITHUB_STEP_SUMMARY"
      # The references against each other (INTEROP_ADAPTERS of the Makefile):
      # fails on a fail, an infra-error or no pass at all (interop_result.py).
      - name: Cross-stack self-test, document schema
        run: |
          set -o pipefail
          make interop 2>&1 | tee reports/interop.log
          python3 scripts/interop_result.py reports/results.json
          grep -E '^\[interop\]' reports/interop.log | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload documents
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-documents-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore

name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly: catches drift in what the pinned builds fetch.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Versions, scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: versions.yaml matches the Dockerfiles
        run: scripts/check-versions.sh
      - name: RELEASE.md has the notes of the version versions.yaml names
        run: scripts/release-notes.sh > /dev/null
      - name: Shellcheck and Python
        run: make lint
      - name: No image is published
        # p-net and profinet-py are GPL: their images are built by each
        # user from upstream, never pushed by this repository.
        run: |
          if grep -rnE 'docker (push|buildx .*--push)' Makefile scripts; then
            echo "::error::a target pushes an image"; exit 1
          fi

  images:
    name: Build and contract (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build every adapter image
        run: make -j3 --output-sync=target images
      - name: Contract
        run: make contract | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Capabilities
        run: make capabilities | tee -a "$GITHUB_STEP_SUMMARY"

name: probe-mrp
on:
  push:
    branches: [feat/umrp]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -q -t profinet-interop-mrp:dev adapters/mrp
      - run: |
          uname -r
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW profinet-interop-mrp:dev kernel-mrp; echo "kernel-mrp exit $?"
          docker run --rm --privileged profinet-interop-mrp:dev kernel-mrp; echo "privileged kernel-mrp exit $?"
